<!-- Per-route metadata, from toolbox/seo.py. Every attribute is escaped because Frappe's Jinja
     environment does not autoescape. The JSON-LD is raw on purpose: it is JSON, and seo.py has
     already escaped the one character that could end the script element early. -->
    <title>{{ seo.title | e }}</title>
    <meta name="description" content="{{ seo.description | e }}" />
    <meta name="robots" content="{{ seo.robots | e }}" />
    <link rel="canonical" href="{{ seo.canonical | e }}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{ seo.site_name | e }}" />
    <meta property="og:title" content="{{ seo.title | e }}" />
    <meta property="og:description" content="{{ seo.description | e }}" />
    <meta property="og:url" content="{{ seo.canonical | e }}" />
    <meta property="og:image" content="{{ seo.image | e }}" />
    <meta property="og:image:width" content="{{ seo.image_width | e }}" />
    <meta property="og:image:height" content="{{ seo.image_height | e }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ seo.title | e }}" />
    <meta name="twitter:description" content="{{ seo.description | e }}" />
    <meta name="twitter:image" content="{{ seo.image | e }}" />
    {%- if seo.structured_data %}
    <script type="application/ld+json">{{ seo.structured_data }}</script>
    {%- endif %}
