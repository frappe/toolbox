<!doctype html>
<html class="h-full" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f8f8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Toolbox" />
    <link rel="manifest" href="/assets/toolbox/pwa/manifest.webmanifest" />
    <link rel="icon" href="/assets/toolbox/pwa/toolbox-192.png" />
    <link rel="apple-touch-icon" href="/assets/toolbox/pwa/toolbox-192.png" />
    <!-- toolbox:server-meta:start -->
    <!-- The build replaces everything between these markers, in toolbox/www/toolbox.html only,
         with per-route metadata. See frontend/build/pwaBuildPlugin.js. What stays here is what
         the dev server shows and what the service worker caches as the offline shell, so it has
         to read sensibly on its own. -->
    <title>Toolbox</title>
    <meta
      name="description"
      content="Free online calculators, converters and lookups. No account, and nothing stored about you."
    />
    <!-- toolbox:server-meta:end -->
    <script>
      // Resolve the saved theme before first paint so dark users never see a
      // light flash. useTheme() re-applies and keeps this reactive after boot.
      // The key mirrors THEME_STORAGE_KEY in useToolboxPreferences.js. Theme is the only
      // preference in localStorage; everything else is sessionStorage and is gone by now.
      ;(function () {
        try {
          var theme = localStorage.getItem('toolbox:theme:v1') || 'system'
          if (theme !== 'light' && theme !== 'dark') {
            theme =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          }
          document.documentElement.dataset.theme = theme
        } catch (error) {}
      })()
    </script>
  </head>
  <body class="h-full bg-surface-white text-ink-gray-9">
    <div id="app" class="h-full">
      <!-- toolbox:server-content:start -->
      <!-- The build replaces everything between these markers, in toolbox/www/toolbox.html only,
           with the heading and the content of the route being served. It stays empty here: this
           copy is the offline shell, where Jinja never runs, and the application fills the
           element as soon as it mounts. -->
      <!-- toolbox:server-content:end -->
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
